<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>CRM Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <h2>CRM</h2>
    <nav>
      <a class="active">Dashboard</a>
      <a>Clienti</a>
      <a>Agenti</a>
      <a>Vendite</a>
      <a>Magazzino</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>Dashboard</h1>
    </header>

    <section class="cards">
      <div class="card">
        <h3>Vendite Totali</h3>
        <p>€ 0</p>
      </div>

      <div class="card">
        <h3>Clienti</h3>
        <p>0</p>
      </div>

      <div class="card warning">
        <h3>Sotto Scorta</h3>
        <p>0</p>
      </div>
    </section>

    <section class="content">
      <h2>Benvenuto</h2>
      <p>Il tuo CRM è online.</p>
    </section>
  </main>

</div>

</body>
</html>
